# leader key
unbind C-b
set -g prefix C-f

# start windows and panes at 1, not 0
set -g base-index 1
set-option -g renumber-windows on
set -g pane-base-index 1

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# tmux-yank rebinds y to also copy to pbcopy
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# let programs in panes (vim, tmux over ssh) set the clipboard via OSC 52
set -s set-clipboard on

# pass clickable links (OSC 8) through to ghostty
set -as terminal-features ',xterm-ghostty:hyperlinks'

set -g mouse on
set -g status-position top
set -g status-style 'bg=default,fg=default'
set -g status-right ''
set -g window-status-format ' #W '
set -g window-status-current-format ' #W '
set -g window-status-style 'fg=colour8,bg=default'
set -g window-status-current-style 'fg=colour7,bg=default'
set -g status-left '#{?client_prefix,#[fg=colour2],#[fg=default]}[#S]#[fg=default]  '
# default of 10 truncates session names
set -g status-left-length 50

bind C-w new-window
bind C-o split-window -h -c "#{pane_current_path}"
bind C-v split-window -v -c "#{pane_current_path}"
bind C-p previous-window
bind C-n next-window
bind C-x kill-pane
bind x kill-window
# quoted like tmux's , so names with ' or a leading - work
bind r command-prompt -I "#W" { rename-window -- '%%' }

# no-op where there's no clipboard program, so y isn't an error
set -g @custom_copy_command 'cat >/dev/null'

# match nix's wrapped nvim and restore it as plain nvim
set -g @resurrect-processes '"~bin/nvim->nvim"'

# The plugins, from features/tmux/default.nix.
source-file ~/.config/tmux/plugins.conf
