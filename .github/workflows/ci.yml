name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Work out what the other jobs do, from the flake's ci output (in
  # flake.nix), so a new configuration needs no change here. The jobs below
  # wait for this one ("needs: plan") and read what it works out as
  # needs.plan.outputs.<name>.
  plan:
    runs-on: ubuntu-latest
    # A job's outputs are strings other jobs can read. Each is copied from an
    # output of the Plan step below.
    outputs:
      # The Cachix cache's name, for example "syhner".
      cache: ${{ steps.plan.outputs.cache }}
      # The regex matching the unfree packages, for example "(spotify|steam)".
      unfree: ${{ steps.plan.outputs.unfree }}
      # JSON lists, which the matrix of the eval and build jobs is made from:
      # one job for each entry.
      evaluate: ${{ steps.plan.outputs.evaluate }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Plan
        id: plan
        env:
          # The runner each platform builds on. This is the one thing about
          # building that's about GitHub rather than the configurations, so
          # it's here rather than in the flake.
          RUNNERS: >-
            {
              "aarch64-darwin": "macos-latest",
              "aarch64-linux": "ubuntu-24.04-arm",
              "x86_64-linux": "ubuntu-latest"
            }
          # macOS runners can wait in the queue until github gives up on the
          # job, so the macOS configurations are only evaluated.
          SKIP_BUILDING: '["aarch64-darwin"]'
        # A step sets its outputs by writing name=value lines to the file
        # $GITHUB_OUTPUT. jq picks each value out of ci.json:
        #
        #   cache     .cache, as plain text (-r)
        #   unfree    .unfree, as plain text
        #   evaluate  .configurations, as JSON on one line (-c), for example
        #             [{"attr":"nixosConfigurations.vps.config.system.build.toplevel","system":"x86_64-linux"}, ...]
        #   build     the same, without the platforms in SKIP_BUILDING, and
        #             with each one's runner added from RUNNERS, for example
        #             [{"attr":"...vps...","system":"x86_64-linux","runner":"ubuntu-latest"}, ...]
        run: |
          nix eval --option allow-import-from-derivation false --json .#ci >ci.json
          {
            echo "cache=$(jq -r .cache ci.json)"
            echo "unfree=$(jq -r .unfree ci.json)"
            echo "evaluate=$(jq -c .configurations ci.json)"
            echo "build=$(jq -c --argjson runners "$RUNNERS" --argjson skip "$SKIP_BUILDING" '
              [
                .configurations[]
                | select(.system | IN($skip[]) | not)
                | . + { runner: $runners[.system] }
              ]
            ' ci.json)"
          } >>"$GITHUB_OUTPUT"

  # Evaluate every configuration (without building it). With import from
  # derivation off, evaluation never builds anything, so one platform can
  # evaluate them all.
  eval:
    name: eval ${{ matrix.attr }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One job for each entry in the plan's evaluate list. fromJSON turns the
      # string back into a list, and each entry's fields become matrix.attr
      # and matrix.system.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.evaluate) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Evaluate
        run: nix eval --option allow-import-from-derivation false --raw '.#${{ matrix.attr }}.drvPath'

  # Build, on each configuration's own platform, the packages it needs that
  # neither cache.nixos.org nor the Cachix cache has, and push them to the
  # cache so later runs (and machines) download them instead.
  build:
    name: build ${{ matrix.attr }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    env:
      # The unfree packages, which the features name: every one, and the
      # downloads and parts they're made from, matches this. They're never
      # built here, and never pushed, since the cache is public and their
      # licences don't allow sharing them.
      UNFREE: ${{ needs.plan.outputs.unfree }}
    strategy:
      fail-fast: false
      # One job for each entry in the plan's build list, which also has
      # matrix.runner, used by runs-on above.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ needs.plan.outputs.cache }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # In case something unfree gets built anyway.
          pushFilter: ${{ env.UNFREE }}
      - name: Evaluate
        id: eval
        run: |
          drv=$(nix eval --option allow-import-from-derivation false --raw '.#${{ matrix.attr }}.drvPath')
          echo "drv=$drv" >> "$GITHUB_OUTPUT"
      - name: Build what isn't cached
        run: .github/scripts/build-uncached.sh '${{ steps.eval.outputs.drv }}'
