name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Work out what the other jobs do, from the flake's ci output (in
  # flake.nix), so a new configuration needs no change here. The jobs below
  # wait for this one ("needs: plan") and read what it works out as
  # needs.plan.outputs.<name>.
  plan:
    runs-on: ubuntu-latest
    # A job's outputs are strings other jobs can read. Each is copied from an
    # output of the Plan step below.
    outputs:
      # The Cachix cache's name, for example "syhner".
      cache: ${{ steps.plan.outputs.cache }}
      # The regex matching the unfree packages, for example "(spotify|steam)".
      unfree: ${{ steps.plan.outputs.unfree }}
      # Every configuration's attribute, as a JSON list, for the eval job.
      evaluate: ${{ steps.plan.outputs.evaluate }}
      # A JSON list with an entry for each platform built on, which the build
      # job's matrix is made from: one job for each entry.
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Plan
        id: plan
        env:
          # The runner each platform builds on. This is the one thing about
          # building that's about GitHub rather than the configurations, so
          # it's here rather than in the flake.
          RUNNERS: >-
            {
              "aarch64-darwin": "macos-latest",
              "aarch64-linux": "ubuntu-24.04-arm",
              "x86_64-linux": "ubuntu-latest"
            }
          # macOS runners can wait in the queue until github gives up on the
          # job, so the macOS configurations are only evaluated.
          SKIP_BUILDING: '["aarch64-darwin"]'
        # A step sets its outputs by writing name=value lines to the file
        # $GITHUB_OUTPUT. jq picks each value out of ci.json:
        #
        #   cache     .cache, as plain text (-r)
        #   unfree    .unfree, as plain text
        #   evaluate  every configuration's attr, as JSON on one line (-c),
        #             for example
        #             ["darwinConfigurations.macbook.system", ...]
        #   build     the configurations grouped by platform, without the
        #             platforms in SKIP_BUILDING, with each platform's runner
        #             from RUNNERS, for example
        #             [{"platform":"x86_64-linux","runner":"ubuntu-latest","attrs":["...vps...", ...]}, ...]
        run: |
          nix eval --option allow-import-from-derivation false --json .#ci >ci.json
          {
            echo "cache=$(jq -r .cache ci.json)"
            echo "unfree=$(jq -r .unfree ci.json)"
            echo "evaluate=$(jq -c '[.configurations[].attr]' ci.json)"
            echo "build=$(jq -c --argjson runners "$RUNNERS" --argjson skip "$SKIP_BUILDING" '
              [
                .configurations
                | group_by(.platform)[]
                | { platform: .[0].platform, attrs: map(.attr) }
                | select(.platform | IN($skip[]) | not)
                | . + { runner: $runners[.platform] }
              ]
            ' ci.json)"
          } >>"$GITHUB_OUTPUT"

  # Evaluate every configuration (without building it), all on one machine,
  # so the flake's inputs are fetched once. With import from derivation off,
  # evaluation never builds anything, so one platform can evaluate them all,
  # including the ones that are never built. It doesn't wait for the build
  # jobs' runners, so it's the quick answer to "does everything evaluate?".
  eval:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Evaluate
        env:
          ATTRS: ${{ needs.plan.outputs.evaluate }}
        run: jq -r '.[]' <<<"$ATTRS" | xargs .github/scripts/evaluate.sh >/dev/null

  # Build, on each platform, the packages its configurations need that
  # neither cache.nixos.org nor the Cachix cache has, and push them to the
  # cache so later runs (and machines) download them instead. One job builds
  # all of a platform's configurations, so what they share is built once,
  # rather than once by each of several jobs running at the same time.
  build:
    name: build ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    env:
      # The unfree packages, which the features name: every one, and the
      # downloads and parts they're made from, matches this. They're never
      # built here, and never pushed, since the cache is public and their
      # licences don't allow sharing them.
      UNFREE: ${{ needs.plan.outputs.unfree }}
    strategy:
      fail-fast: false
      # One job for each entry in the plan's build list. Each entry's fields
      # become matrix.platform, matrix.runner (used by runs-on above) and
      # matrix.attrs.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ needs.plan.outputs.cache }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # In case something unfree gets built anyway.
          pushFilter: ${{ env.UNFREE }}
      # The derivations have to be in this machine's store to be built, so
      # the configurations are evaluated again here. One that doesn't
      # evaluate fails the eval job; this one builds the rest anyway, so
      # they still reach the cache.
      - name: Evaluate
        env:
          ATTRS: ${{ toJSON(matrix.attrs) }}
        run: |
          jq -r '.[]' <<<"$ATTRS" | xargs .github/scripts/evaluate.sh >"$RUNNER_TEMP/drvs.txt" ||
            echo "::warning::Some configurations don't evaluate (the eval job shows which); building the rest."
      - name: Build what isn't cached
        run: xargs .github/scripts/build-uncached.sh <"$RUNNER_TEMP/drvs.txt"
