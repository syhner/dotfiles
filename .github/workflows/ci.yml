name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # read .github/ci.nix, which says what the build job does
  plan:
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.plan.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Plan
        id: plan
        run: |
          ci=$(nix eval --option allow-import-from-derivation false --json .#ci)
          echo "ci=$ci" >>"$GITHUB_OUTPUT"

  # Build, on each platform, the packages its configurations need that
  # neither cache.nixos.org nor the Cachix cache has, and push them to the
  # cache so later runs (and machines) download them instead. One job builds
  # all of a platform's configurations, so what they share is built once,
  # rather than once by each of several jobs running at the same time.
  build:
    name: build ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # for the identity token the tailnet trusts
      id-token: write
    env:
      # The unfree packages, which the features name: every one, and the
      # downloads and parts they're made from, matches this. They're never
      # built here, and never pushed, since the cache is public and their
      # licences don't allow sharing them.
      UNFREE: ${{ fromJSON(needs.plan.outputs.ci).unfree }}
      # Whether to try the fleet's builders. A fork's pull request can't join
      # the tailnet anyway: it gets no identity token.
      FLEET: >-
        ${{ toJSON(matrix.builders) != '[]'
          && fromJSON(needs.plan.outputs.ci).credential != null
          && !github.event.pull_request.head.repo.fork }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ci).platforms }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ fromJSON(needs.plan.outputs.ci).cache }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # in case something unfree gets built anyway
          pushFilter: ${{ env.UNFREE }}
      # As a short-lived machine tagged tag:ci, which may log in to the
      # fleet's machines as their shared user (see features/fleet-access).
      # It proves it's this repository's workflow with GitHub's identity
      # token, so there's no secret.
      - name: Join the tailnet
        if: env.FLEET == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ fromJSON(needs.plan.outputs.ci).credential.clientId }}
          audience: ${{ fromJSON(needs.plan.outputs.ci).credential.audience }}
          tags: tag:ci
      # The first of the platform's builders that's online and answers, as a
      # line for Nix's builders setting. The Nix daemon connects to it, as
      # root. WireGuard proves which machine answered, so its host key is
      # taken as it is. A Mac's Linux VM answers through the Mac, which runs
      # remoteProgram in place of nix-daemon.
      - name: Find a builder
        id: builder
        if: env.FLEET == 'true'
        env:
          BUILDERS: ${{ toJSON(matrix.builders) }}
          PLATFORM: ${{ matrix.platform }}
          LOCAL: ${{ matrix.local }}
        run: |
          printf 'Host 100.*\n  StrictHostKeyChecking accept-new\n' |
            sudo tee /etc/ssh/ssh_config.d/50-tailnet.conf >/dev/null
          nix=$(command -v nix)
          online=$(tailscale status --json | jq -r '(.Peer // {})[] | select(.Online) | .HostName')
          while IFS=$'\t' read -r host spec store; do
            if ! grep -qxF "$host" <<<"$online"; then
              echo "$host is offline."
              continue
            fi
            store=${store/"@$host"/"@$(tailscale ip -4 "$host")"}
            # A new machine takes a few seconds to reach the others.
            for _ in 1 2 3; do
              if timeout 30 sudo "$nix" store info --store "$store" >/dev/null; then
                echo "Building on $host ($store)."
                echo "builders=$store $spec" >>"$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 5
            done
            echo "$host didn't answer."
          done < <(jq -r '.[] | [.hostname, .spec, .store] | @tsv' <<<"$BUILDERS")
          if [ "$LOCAL" != true ]; then
            echo "::warning::None of the $PLATFORM builders is online, so its configurations are only evaluated."
          fi
        shell: bash
      - name: Evaluate
        env:
          ATTRS: ${{ toJSON(matrix.attrs) }}
        run: jq -r '.[]' <<<"$ATTRS" | xargs .github/scripts/evaluate.sh >"$RUNNER_TEMP/drvs.txt"
      # With a builder, Nix sends it what it can't build here, or for macOS,
      # everything, and copies back what it built.
      - name: Build what isn't cached
        if: ${{ !cancelled() && (matrix.local || steps.builder.outputs.builders != '') }}
        env:
          # cachix-action's post-build hook pushes what comes back, too
          NIX_CONFIG: |
            builders = ${{ steps.builder.outputs.builders }}
            builders-use-substitutes = true
        run: xargs .github/scripts/build-uncached.sh <"$RUNNER_TEMP/drvs.txt"

  # Check formatting and shell scripts (see .github/scripts/lint.sh). Each
  # check runs even if one before it failed, so one run shows every problem.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nixfmt
        run: .github/scripts/lint.sh nixfmt
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: .github/scripts/lint.sh shellcheck
      - name: actionlint
        if: ${{ !cancelled() }}
        run: .github/scripts/lint.sh actionlint
