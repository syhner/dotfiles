name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # work out what the other jobs do, from the flake's ci output
  plan:
    runs-on: ubuntu-latest
    outputs:
      # The Cachix cache's name, for example "syhner".
      cache: ${{ steps.plan.outputs.cache }}
      # The regex matching the unfree packages, for example "(spotify|steam)".
      unfree: ${{ steps.plan.outputs.unfree }}
      # The attributes of the configurations that aren't built, as a JSON
      # list, for the eval job.
      evaluate: ${{ steps.plan.outputs.evaluate }}
      # A JSON list with an entry for each platform built on, which the build
      # job's matrix is made from: one job for each entry.
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Plan
        id: plan
        env:
          RUNNERS: >-
            {
              "aarch64-darwin": "macbook",
              "aarch64-linux": "ubuntu-24.04-arm",
              "x86_64-linux": "ubuntu-latest"
            }
          # don't run public PR events on a self-hosted runner
          SKIP_BUILDING: >-
            ${{ github.event_name == 'pull_request' && '["aarch64-darwin"]' || '[]' }}
        #   cache     .cache, as plain text (-r)
        #   unfree    .unfree, as plain text
        #   evaluate  the attrs of the configurations on the platforms in
        #             SKIP_BUILDING, as JSON on one line (-c), for example
        #             ["darwinConfigurations.macbook.system", ...]
        #   build     the configurations grouped by platform, without the
        #             platforms in SKIP_BUILDING, with each platform's runner
        #             from RUNNERS, for example
        #             [{"platform":"x86_64-linux","runner":"ubuntu-latest","attrs":["...vps...", ...]}, ...]
        run: |
          nix eval --option allow-import-from-derivation false --json .#ci >ci.json
          {
            echo "cache=$(jq -r .cache ci.json)"
            echo "unfree=$(jq -r .unfree ci.json)"
            echo "evaluate=$(jq -c --argjson skip "$SKIP_BUILDING" '
              [.configurations[] | select(.platform | IN($skip[])) | .attr]
            ' ci.json)"
            echo "build=$(jq -c --argjson runners "$RUNNERS" --argjson skip "$SKIP_BUILDING" '
              [
                .configurations
                | group_by(.platform)[]
                | { platform: .[0].platform, attrs: map(.attr) }
                | select(.platform | IN($skip[]) | not)
                | . + { runner: $runners[.platform] }
              ]
            ' ci.json)"
          } >>"$GITHUB_OUTPUT"

  # Evaluate the configurations (that aren't built)
  eval:
    needs: plan
    if: needs.plan.outputs.evaluate != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Evaluate
        env:
          ATTRS: ${{ needs.plan.outputs.evaluate }}
        run: jq -r '.[]' <<<"$ATTRS" | xargs .github/scripts/evaluate.sh >/dev/null

  # Build, on each platform, the packages its configurations need that
  # neither cache.nixos.org nor the Cachix cache has, and push them to the
  # cache so later runs (and machines) download them instead. One job builds
  # all of a platform's configurations, so what they share is built once,
  # rather than once by each of several jobs running at the same time.
  build:
    name: build ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    env:
      # The unfree packages, which the features name: every one, and the
      # downloads and parts they're made from, matches this. They're never
      # built here, and never pushed, since the cache is public and their
      # licences don't allow sharing them.
      UNFREE: ${{ needs.plan.outputs.unfree }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v7
      # A self-hosted runner has Nix and the cache already, and pushes itself
      - uses: cachix/install-nix-action@v31
        if: runner.environment == 'github-hosted'
      - uses: cachix/cachix-action@v17
        if: runner.environment == 'github-hosted'
        with:
          name: ${{ needs.plan.outputs.cache }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # in case something unfree gets built anyway
          pushFilter: ${{ env.UNFREE }}
      - name: Evaluate
        env:
          ATTRS: ${{ toJSON(matrix.attrs) }}
        run: jq -r '.[]' <<<"$ATTRS" | xargs .github/scripts/evaluate.sh >"$RUNNER_TEMP/drvs.txt"
      - name: Build what isn't cached
        if: ${{ !cancelled() }}
        env:
          BUILT: ${{ runner.environment == 'self-hosted' && format('{0}/built.txt', runner.temp) || '' }}
        run: xargs .github/scripts/build-uncached.sh <"$RUNNER_TEMP/drvs.txt"
      # On a self-hosted runner, only what was built here: other things add
      # to its store too, which cachix-action would push. The token is given
      # only to this step, so it isn't left on the machine for later jobs.
      - name: Push what was built
        if: ${{ !cancelled() && runner.environment == 'self-hosted' }}
        env:
          CACHE: ${{ needs.plan.outputs.cache }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -s "$RUNNER_TEMP/built.txt" ]; then
            cachix push "$CACHE" <"$RUNNER_TEMP/built.txt"
          fi

  # Check formatting and shell scripts, with the tools pinned by flake.lock so
  # they match what the machines run. Each check runs even if one before it
  # failed, so one run shows every problem.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # secret/ is encrypted here, so it's left out
      - name: nixfmt
        run: |
          git ls-files -z '*.nix' ':!:secret/**' |
            nix shell --inputs-from . nixpkgs-nixos#nixfmt -c xargs -0 nixfmt --check
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: nix shell --inputs-from . nixpkgs-nixos#shellcheck -c shellcheck .github/scripts/*.sh
      # with shellcheck, it also checks the workflows' run: scripts
      - name: actionlint
        if: ${{ !cancelled() }}
        run: nix shell --inputs-from . nixpkgs-nixos#actionlint nixpkgs-nixos#shellcheck -c actionlint
