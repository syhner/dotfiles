name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # read .github/ci.nix, which says what the build job does
  plan:
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.plan.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Plan
        id: plan
        run: |
          ci=$(nix eval --option allow-import-from-derivation false --json .#ci)
          echo "ci=$ci" >>"$GITHUB_OUTPUT"

  # Build, on each platform, the packages its configurations need that
  # neither cache.nixos.org nor the Cachix cache has, and push them to the
  # cache so later runs (and machines) download them instead. One job builds
  # all of a platform's configurations, so what they share is built once,
  # rather than once by each of several jobs running at the same time.
  build:
    name: build ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # for the identity token the tailnet trusts
      id-token: write
    env:
      # The unfree packages, which the features name: every one, and the
      # downloads and parts they're made from, matches this. They're never
      # built here, and never pushed, since the cache is public and their
      # licences don't allow sharing them.
      UNFREE: ${{ fromJSON(needs.plan.outputs.ci).unfree }}
      # Whether to try the fleet's builders. A fork's pull request can't join
      # the tailnet anyway: it gets no identity token.
      FLEET: >-
        ${{ toJSON(matrix.builders) != '[]'
          && fromJSON(needs.plan.outputs.ci).credential != null
          && !github.event.pull_request.head.repo.fork }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ci).platforms }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ fromJSON(needs.plan.outputs.ci).cache }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # in case something unfree gets built anyway
          pushFilter: ${{ env.UNFREE }}
      # As a short-lived machine tagged tag:ci, which may log in to the
      # fleet's machines as their shared user (see features/fleet-access).
      # It proves it's this repository's workflow with GitHub's identity
      # token, so there's no secret.
      - name: Join the tailnet
        if: env.FLEET == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ fromJSON(needs.plan.outputs.ci).credential.clientId }}
          audience: ${{ fromJSON(needs.plan.outputs.ci).credential.audience }}
          tags: tag:ci
      # The first of the platform's builders that answers, as a line for
      # Nix's builders setting. The Nix daemon connects to it at its tailnet
      # address, with the machines' SSH settings (see features/ssh).
      - name: Find a builder
        id: builder
        if: env.FLEET == 'true'
        env:
          BUILDERS: ${{ toJSON(matrix.builders) }}
          SSH_CONFIG: ${{ fromJSON(needs.plan.outputs.ci).sshConfig }}
        run: |
          sudo tee /etc/ssh/ssh_config.d/50-tailnet.conf <<<"$SSH_CONFIG" >/dev/null
          while read -r line; do
            store=${line%% *}
            if timeout 30 nix store info --store "$store" >/dev/null; then
              echo "Building on $store."
              echo "builders=$line" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(jq -r '.[]' <<<"$BUILDERS")
          echo "::warning::No builder answered."
        shell: bash
      - name: Evaluate
        env:
          ATTRS: ${{ toJSON(matrix.attrs) }}
        run: jq -r '.[]' <<<"$ATTRS" | xargs .github/scripts/evaluate.sh >"$RUNNER_TEMP/drvs.txt"
      # With a builder, Nix sends it what it can't build here, or for macOS,
      # everything, and copies back what it built.
      - name: Build what isn't cached
        if: ${{ !cancelled() && (matrix.local || steps.builder.outputs.builders != '') }}
        env:
          # cachix-action's post-build hook pushes what comes back, too
          NIX_CONFIG: |
            builders = ${{ steps.builder.outputs.builders }}
            builders-use-substitutes = true
        run: xargs .github/scripts/build-uncached.sh <"$RUNNER_TEMP/drvs.txt"

  # Build the flake's lint checks (see nix/checks.nix). Each runs even if one
  # before it failed, so one run shows every problem.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nixfmt
        run: nix build --no-link -L .#checks.x86_64-linux.nixfmt
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: nix build --no-link -L .#checks.x86_64-linux.shellcheck
      - name: actionlint
        if: ${{ !cancelled() }}
        run: nix build --no-link -L .#checks.x86_64-linux.actionlint
