name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Evaluate every configuration (without building it). With import from
  # derivation off, evaluation never builds anything, so one platform can
  # evaluate them all.
  eval:
    name: eval ${{ matrix.attr }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attr:
          - darwinConfigurations.macbook.system
          - legacyPackages.aarch64-darwin.homeConfigurations.siraj.activationPackage
          - nixosConfigurations.utm-guest.config.system.build.toplevel
          - nixosConfigurations.utm-guest-gnome.config.system.build.toplevel
          - legacyPackages.aarch64-linux.homeConfigurations.siraj.activationPackage
          - nixosConfigurations.vps.config.system.build.toplevel
          - legacyPackages.x86_64-linux.homeConfigurations.siraj.activationPackage
    steps:
      - uses: actions/checkout@v7
      # Determinate Nix, for lazy trees: evaluation reads the flake inputs
      # without first copying each of them (three nixpkgs) into the store.
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: lazy-trees = true
      - name: Evaluate
        run: nix eval --option allow-import-from-derivation false --raw '.#${{ matrix.attr }}.drvPath'
