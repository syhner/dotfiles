name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Evaluate every configuration (without building it). With import from
  # derivation off, evaluation never builds anything, so one platform can
  # evaluate them all.
  eval:
    name: eval ${{ matrix.attr }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attr:
          - darwinConfigurations.macbook.system
          - legacyPackages.aarch64-darwin.homeConfigurations.siraj.activationPackage
          - nixosConfigurations.utm-guest.config.system.build.toplevel
          - nixosConfigurations.utm-guest-gnome.config.system.build.toplevel
          - legacyPackages.aarch64-linux.homeConfigurations.siraj.activationPackage
          - nixosConfigurations.vps.config.system.build.toplevel
          - legacyPackages.x86_64-linux.homeConfigurations.siraj.activationPackage
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Evaluate
        run: nix eval --option allow-import-from-derivation false --raw '.#${{ matrix.attr }}.drvPath'

  # Build, on each configuration's own platform, the packages it needs that
  # neither cache.nixos.org nor the syhner cache has, and push them to the
  # syhner cache so later runs (and machines) download them instead.
  build:
    name: build ${{ matrix.attr }}
    runs-on: ${{ matrix.runner }}
    env:
      # The unfree packages: every one, and the downloads and parts they're
      # made from, has one of these in its name. They're never built here, and
      # never pushed, since the cache is public and their licences don't allow
      # sharing them. Add any new unfree package here.
      UNFREE: (claude|discord|obsidian|spotify|steam)
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runners can wait in the queue until github gives up on the job.
          # - attr: darwinConfigurations.macbook.system
          #   runner: macos-latest
          # - attr: legacyPackages.aarch64-darwin.homeConfigurations.siraj.activationPackage
          #   runner: macos-latest
          - attr: nixosConfigurations.utm-guest.config.system.build.toplevel
            runner: ubuntu-24.04-arm
          - attr: nixosConfigurations.utm-guest-gnome.config.system.build.toplevel
            runner: ubuntu-24.04-arm
          - attr: legacyPackages.aarch64-linux.homeConfigurations.siraj.activationPackage
            runner: ubuntu-24.04-arm
          - attr: nixosConfigurations.vps.config.system.build.toplevel
            runner: ubuntu-latest
          - attr: legacyPackages.x86_64-linux.homeConfigurations.siraj.activationPackage
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: syhner
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # In case something unfree gets built anyway.
          pushFilter: ${{ env.UNFREE }}
      - name: Evaluate
        id: eval
        run: |
          drv=$(nix eval --option allow-import-from-derivation false --raw '.#${{ matrix.attr }}.drvPath')
          echo "drv=$drv" >> "$GITHUB_OUTPUT"
      - name: Build what isn't cached
        run: .github/scripts/build-uncached.sh '${{ steps.eval.outputs.drv }}'
